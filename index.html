}
function resetRivalResults(){rivalTicket++;rivalStarted=false;rivalData.clear();discard(rivalMarkers);if(rivalCircle)rivalCircle.setMap(null);rivalCircle=null;drawRivalPanel()}
function visibleRivals(){return [...rivalData.entries()].filter(([id,v])=>rivalEnabled.has(id)&&v.state==='ok').flatMap(([,v])=>v.pois).sort((a,b)=>a.distance-b.distance||a.name.localeCompare(b.name,'zh'))}
function updateRivalList(){
 if(!$('rival-list')||!rivalAnchor)return;
 const entries=[...rivalEnabled].map(id=>rivalData.get(id)),loading=entries.some(x=>x?.state==='loading'),errors=entries.filter(x=>x?.state==='error').length,pois=visibleRivals();
 let text=!good(rivalAnchor)?'该门店缺少可用坐标，暂不能查询。':!rivalEnabled.size?'请选择至少一个品牌。':!rivalStarted?'仅查询当前单店附近；距离为直线距离。':loading?'正在查询所选品牌…':errors?`${errors} 个品牌查询失败，可点击重新查询；成功结果仍保留。`:pois.length?`找到 ${pois.length} 家 · 直线距离 · 高德 POI 可能存在遗漏或更新延迟。`:'所选品牌在此范围内未返回匹配门店。';
 if(entries.some(x=>x?.partial))text+=' 部分结果未完整返回，数量为已加载数。';if(errors){const err=entries.find(x=>x?.state==='error');text+=' '+err.error}if(rivalAnchor.geo?.approximate)text+=' 当前Tims为近似位置，仅供参考。';$('rival-status').textContent=text;
 $('rival-list').replaceChildren(...pois.map(p=>{const b=document.createElement('button');b.className='rival-item';b.innerHTML=`<span class="rival-distance">${rangeLabel(p.distance)}</span><strong>${esc(p.name)}</strong><small>${esc(p.brand.name)} · ${esc(p.address||'地址未返回')}</small>`;b.onclick=()=>showRival(p);return b}));
}
function showRival(p){const box=$('rival-card');if(!box)return;box.className='rival-card';box.innerHTML=`<h3>${esc(p.name)}</h3><div class="address">${esc(p.address||'地址未返回')}</div><div class="feature-note">距当前 Tims ${rangeLabel(p.distance)} · 直线距离</div>`;actionButtons(p,box);if(map)map.setZoomAndCenter(16,[p.lng,p.lat]);box.scrollIntoView({block:'nearest',behavior:'smooth'})}
function logoContent(b){const d=document.createElement('div');d.className='rival-pin';d.style.setProperty('--brand-color',b.color);const img=document.createElement('img');img.src=b.logo;img.alt=b.name;img.onerror=()=>{img.remove();const fallback=document.createElement('span');fallback.className='rival-pin-fallback';fallback.textContent=b.name;d.append(fallback)};d.append(img);return d}
function drawRivals(fitView=false){discard(rivalMarkers);if(rivalCircle)rivalCircle.setMap(null);rivalCircle=null;if(!map||!rivalAnchor||!rivalStarted||routeState||!good(rivalAnchor))return;
 const pois=visibleRivals();if(!rivalEnabled.size)return;
 rivalCircle=new AMap.Circle({map,center:[rivalAnchor.geo.lng,rivalAnchor.geo.lat],radius:rivalRadius*1000,strokeColor:'#9b7365',strokeStyle:'dashed',strokeWeight:1,fillOpacity:.025,fillColor:'#986647',zIndex:21});
 for(const p of pois){const marker=new AMap.Marker({map,position:[p.lng,p.lat],content:logoContent(p.brand),offset:new AMap.Pixel(-18,-18),zIndex:200,title:p.name});marker.on('click',()=>showRival(p));rivalMarkers.push(marker)}
 if(fitView)map.setBounds(rivalCircle.getBounds(),true,innerWidth>900?[95,410,70,280]:innerWidth>600?[95,410,70,35]:[130,35,300,35],16);
}
function searchPage(service,keyword,center,radius){return new Promise((resolve,reject)=>{let settled=false;const timer=setTimeout(()=>{settled=true;reject(Error('查询超时，请重试。'))},16000);service.searchNearBy(keyword,center,radius,(status,result)=>{if(settled)return;settled=true;clearTimeout(timer);if(status==='complete')resolve(result.poiList||{pois:[],count:0});else if(status==='no_data')resolve({pois:[],count:0});else reject(Error('高德搜索未完成，请检查网络、Key 权限或配额。'))})})}
async function searchBrand(brand,anchor,radius,ticket,refresh){
 const cacheKey=[anchor.id,anchor.geo.lng,anchor.geo.lat,radius,brand.id].join('|'),cached=poiCache.get(cacheKey);
 if(!refresh&&cached&&Date.now()-cached.at<300000)return cached.value;
 const service=new AMap.PlaceSearch({pageSize:50,pageIndex:1,type:'餐饮服务',extensions:'base',citylimit:false,autoFitView:false});const found=new Map();let partial=false;
 for(let page=1;page<=10;page++){
  if(ticket!==rivalTicket)return null;service.setPageIndex(page);const result=await searchPage(service,brand.keyword,[anchor.geo.lng,anchor.geo.lat],radius*1000);if(ticket!==rivalTicket)return null;
  for(const p of result.pois||[]){const pt=pointOf(p.location);if(!pt||!brand.match.test(p.name||''))continue;const d=kmBetween(anchor.geo,pt);if(d>radius+.001)continue;const id=p.id||[p.name,pt.lng,pt.lat].join('|');found.set(id,{id:'poi:'+id,name:p.name,address:[p.pname,p.cityname,p.adname,p.address].filter(x=>typeof x==='string'&&x).join(' '),city:p.cityname||'',brand,...pt,distance:d})}
  const total=Number(result.count)||0;if(page*50>=total||(result.pois||[]).length<50)break;if(page===10)partial=true;
 }
 const value={state:'ok',pois:[...found.values()],partial};poiCache.set(cacheKey,{at:Date.now(),value});return value;
}
async function queryRivals(refresh=false){
 if(!needMap()||!rivalAnchor||!good(rivalAnchor)||!rivalEnabled.size)return;
 rivalStarted=true;const ticket=++rivalTicket,anchor=rivalAnchor,radius=rivalRadius;
 const chosen=BRANDS.filter(b=>rivalEnabled.has(b.id));for(const b of chosen)rivalData.set(b.id,{state:'loading',pois:[]});drawRivalPanel();drawRivals(true);
 // Sequential brand/page requests reduce bursts; a changed selection invalidates old responses.
 for(const brand of chosen){if(ticket!==rivalTicket)return;try{const value=await searchBrand(brand,anchor,radius,ticket,refresh);if(ticket!==rivalTicket||!value)return;rivalData.set(brand.id,value)}catch(e){if(ticket!==rivalTicket)return;rivalData.set(brand.id,{state:'error',pois:[],error:e.message})}drawRivalPanel();drawRivals()}
}
function chooseOrigin(target){if(!pointOf(target)){notify('此位置坐标不可用。');return}cancelRoute(false);originChoice={...target};paintRouteBar();notify('已设为起点，请选择另一家 Tims 或竞品，点击“去这里”。')}
function navigationURL(a,b,mode){const q=new URLSearchParams({from:[a.lng,a.lat,a.name].join(','),to:[b.lng,b.lat,b.name].join(','),mode:mode==='bus'?'bus':'car',policy:'0',src:'TimsStoreMap',callnative:'1'});return 'https://uri.amap.com/navigation?'+q.toString()}
function durationLabel(seconds){if(!Number.isFinite(seconds)||seconds<0)return '时间未返回';const minutes=Math.max(1,Math.ceil(seconds/60));return minutes>=60?Math.floor(minutes/60)+'小时'+(minutes%60?minutes%60+'分钟':''):minutes+'分钟'}
function requestService(service,from,to){return new Promise((resolve,reject)=>{let settled=false;const timer=setTimeout(()=>{settled=true;reject(Error('查询超时，可在高德中重试'))},18000);try{service.search([from.lng,from.lat],[to.lng,to.lat],(status,result)=>{if(settled)return;settled=true;clearTimeout(timer);if(status==='complete')resolve(result);else if(status==='no_data')reject(Error('未找到可用路线'));else reject(Error('查询失败，请检查网络或高德服务权限'))})}catch(e){clearTimeout(timer);reject(e)}})}
function reverseCity(p){if(p.city&&!/^\d+$/.test(p.city))return Promise.resolve(p.city);return new Promise(resolve=>{let done=false;const finish=c=>{if(done)return;done=true;clearTimeout(timer);p.city=c;resolve(c)};const timer=setTimeout(()=>finish(''),9000);try{new AMap.Geocoder().getAddress([p.lng,p.lat],(status,result)=>{const ac=result?.regeocode?.addressComponent;finish(status==='complete'&&ac?(typeof ac.city==='string'&&ac.city?ac.city:ac.province||''):'')})}catch{finish('')}})}
async function goTo(target){
 if(!needMap()||!pointOf(target))return;
 const from=originChoice||await askLocation();if(!from)return;const to={...target};
 if(kmBetween(from,to)<.005){notify('起点与终点相同或非常接近，请选择另一家门店。');return}
 routeTicket++;discard(routeLayers);routePaintKey='';const ticket=routeTicket;routeState={ticket,from:{...from},to,mode:'car',car:{state:'loading'},bus:{state:'loading'}};if(nearCircle)nearCircle.setMap(null);discard(rivalMarkers);if(rivalCircle)rivalCircle.setMap(null);$('detail').hidden=true;document.body.classList.remove('detail-open');cleanRivals();paintRouteBar();
 const state=routeState;
 Promise.resolve().then(()=>requestService(new AMap.Driving({extensions:'all',hideMarkers:true,autoFitView:false}),state.from,to)).then(r=>{if(ticket!==routeTicket)return;const plan=r.routes?.[0];if(!plan)throw Error('未找到可用驾车路线');state.car={state:'ok',plan};paintRouteBar()},e=>{if(ticket!==routeTicket)return;state.car={state:'error',error:e.message};paintRouteBar()}).catch(e=>{if(ticket===routeTicket){state.car={state:'error',error:e.message};paintRouteBar()}});
 try{const [startCity,endCity]=await Promise.all([reverseCity(state.from),reverseCity(to)]);if(ticket!==routeTicket)return;if(!startCity||!endCity)throw Error('城市未识别，请在高德中查看公交');if(startCity.replace(/市$/,'')!==endCity.replace(/市$/,''))throw Error('跨城公交请在高德中查看');const r=await requestService(new AMap.Transfer({city:startCity,cityd:endCity,extensions:'all',hideMarkers:true,autoFitView:false}),state.from,to);if(ticket!==routeTicket)return;const plan=r.plans?.[0];if(!plan)throw Error('未找到可用公共交通方案');state.bus={state:'ok',plan};paintRouteBar()}catch(e){if(ticket===routeTicket){state.bus={state:'error',error:e.message};paintRouteBar()}}
}
function routePieces(plan,mode){
 if(mode==='car')return (plan.steps||[]).map(step=>({path:step.path||[],walk:false,label:step.instruction||''}));
 const pieces=[];for(const seg of plan.segments||[]){
  const w=seg.walking;if(w){if(w.path?.length)pieces.push({path:w.path,walk:true,label:w.instruction||'步行'});else for(const st of w.steps||[])pieces.push({path:st.path||[],walk:true,label:st.instruction||'步行'})}
  const t=seg.transit;if(t?.path?.length)pieces.push({path:t.path,walk:seg.transit_mode==='WALK',label:seg.instruction||(t.lines||[]).map(l=>l.name).join(' / ')||t.instruction||(seg.transit_mode==='WALK'?'步行':'公交／地铁')});
  const b=seg.bus?.buslines?.[0];if(b?.path?.length)pieces.push({path:b.path,walk:false,label:b.name||'公交／地铁'});
  if(seg.railway?.path?.length)pieces.push({path:seg.railway.path,walk:false,label:seg.railway.name||'铁路'});
 }if(!pieces.length&&plan.path?.length)pieces.push({path:plan.path,walk:false,label:'推荐公共交通路线'});return pieces;
}
function drawRoute(){
 if(!routeState||!map)return;const current=routeState[routeState.mode],key=routeState.ticket+'|'+routeState.mode+'|'+current.state;
 if(key===routePaintKey)return;routePaintKey=key;discard(routeLayers);
 for(const [i,p] of [routeState.from,routeState.to].entries())routeLayers.push(new AMap.Marker({map,position:[p.lng,p.lat],content:`<div class="route-endpoint ${i?'end':''}">${i?'终':'起'}</div>`,offset:new AMap.Pixel(-13,-13),zIndex:250,title:p.name}));
 if(current.state==='ok'){for(const piece of routePieces(current.plan,routeState.mode)){if(piece.path.length<2)continue;routeLayers.push(new AMap.Polyline({map,path:piece.path,strokeColor:piece.walk?'#999':routeState.mode==='car'?'#2575cf':'#23805f',strokeWeight:piece.walk?4:6,strokeStyle:piece.walk?'dashed':'solid',strokeOpacity:.9,zIndex:150}))}}
 if(routeLayers.length)map.setFitView(routeLayers,false,innerWidth>600?[95,35,200,290]:[130,30,240,30],16);
}
function paintRouteBar(){
 const bar=$('routebar');bar.hidden=false;document.body.classList.add('routing');
 if(!routeState){bar.innerHTML=`<div class="route-heading"><strong>起点：${esc(originChoice?.name||'当前位置')} → 请在门店信息框点击“去这里”</strong><button id="close-route" aria-label="取消起点">×</button></div>`;$('close-route').onclick=()=>cancelRoute();return}
 const st=routeState;bar.innerHTML=`<div class="route-heading"><strong title="${esc(st.from.name+' → '+st.to.name)}">${esc(st.from.name)} → ${esc(st.to.name)}</strong><button id="route-retry">重试</button><button id="close-route" aria-label="关闭路线">×</button></div><div class="route-modes" id="route-modes"></div><div class="route-info" id="route-info"></div><div id="route-details"></div>`;
 for(const [mode,name] of [['car','驾车'],['bus','公共交通']]){const entry=st[mode],b=document.createElement('button');b.className=mode===st.mode?'active':'';b.setAttribute('aria-pressed',String(mode===st.mode));b.innerHTML=`${name} · ${entry.state==='loading'?'查询中…':entry.state==='ok'?'预计 '+durationLabel(Number(entry.plan.time)):'暂无方案'}<small>${entry.state==='ok'&&Number.isFinite(Number(entry.plan.distance))?(Number(entry.plan.distance)/1000).toFixed(1)+' km':entry.state==='error'?esc(entry.error):'推荐方案'}</small>`;b.onclick=()=>{st.mode=mode;paintRouteBar()};$('route-modes').append(b)}
 const a=document.createElement('a');a.href=navigationURL(st.from,st.to,st.mode);a.target='_blank';a.rel='noopener noreferrer';a.textContent='高德导航 ↗';$('route-modes').append(a);
 const active=st[st.mode];$('route-info').textContent='预计时间以本次查询为准。'+(st.from.approximate||st.to.approximate?'起终点含近似坐标，路线仅供参考。':'');
 if(active.state==='ok'){const pieces=routePieces(active.plan,st.mode),labels=st.mode==='bus'?(active.plan.segments||[]).map(s=>s.instruction||(s.transit?.lines||[]).map(l=>l.name).join(' / ')||s.bus?.buslines?.[0]?.name||(s.walking?'步行':'')).filter(Boolean):pieces.map(p=>p.label).filter(Boolean);const details=document.createElement('details');details.innerHTML=`<summary>${st.mode==='bus'?'查看换乘与步行详情':'查看路线详情'}</summary><div class="route-steps">${labels.map(esc).join('<br>')||'详细路段未返回，请打开高德查看。'}</div>`;$('route-details').append(details);if(!pieces.some(p=>p.path.length>1))$('route-info').textContent+=' 路线图形未返回，请在高德中查看。'}
 $('close-route').onclick=()=>cancelRoute();$('route-retry').onclick=()=>{const from=st.from,to=st.to;originChoice=from;goTo(to)};drawRoute();
}
$('near-me').onclick=()=>startNearby();$('relocate').onclick=()=>startNearby(true);
for(const radius of [3,5,10]){const b=document.createElement('button');b.textContent=radius+' km';b.className=radius===nearRadius?'active':'';b.setAttribute('aria-pressed',String(radius===nearRadius));b.onclick=()=>{nearRadius=radius;hideDetailDiscovery();cancelRoute(false);$('near-tools').querySelectorAll('[data-radius]').forEach(x=>{x.classList.toggle('active',Number(x.dataset.radius)===radius);x.setAttribute('aria-pressed',String(Number(x.dataset.radius)===radius))});render();drawNearby(true)};b.dataset.radius=radius;$('near-radii').append(b)}
$('manual-near').onclick=()=>{if(!needMap())return;const promise=askLocation(true);$('manual-location').click();promise.then(p=>{if(p)startNearby()})};
for(const id of ['cities','regions'])$(id).addEventListener('click',e=>{if(e.target.closest('button')){leaveNearby();hideDetailDiscovery();cancelRoute(false)}},true);
$('reset').addEventListener('click',()=>{leaveNearby();hideDetailDiscovery();cancelRoute(false);render();baseFit()},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(pickCleanup)$('cancel-pick').click();else if($('location-dialog').open)$('cancel-location').click();else if(routeState||originChoice)cancelRoute();cleanRivals()}});

render();initMap();
</script></body></html>
